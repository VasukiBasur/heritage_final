{% extends 'base_layout.html' %}

{% block title %}Reviews & Ratings - Heritage Handloom
<!-- Toast Notification Container -->
<div id="toast-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;"></div>

<script>
    window.showToast = function(message) {
        const toast = document.createElement('div');
        toast.className = 'bg-black/90 border border-brand-gold/50 shadow-lg text-white px-5 py-3 rounded-lg text-sm transition-opacity duration-300 opacity-0';
        toast.innerHTML = `<span class="flex items-center"><svg class="w-5 h-5 mr-2 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>${message}</span>`;
        const container = document.getElementById('toast-container');
        if(container) {
            container.appendChild(toast);
            setTimeout(() => toast.style.opacity = '1', 10);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }
    };

    // Reviews Management Logic
    const defaultReviews = [
        { id: 1, title: 'Kanjeevaram Bridal Silk', text: 'Absolutely stunning piece of craftsmanship. The zari work is exquisite and the silk quality is top-notch. It was exactly as described and shipped very securely.', date: 'May 10, 2026' },
        { id: 2, title: 'Unspun Raw Silk Material', text: 'Great texture and natural sheen. Perfect for the custom jacket I was planning. The delivery was slightly delayed by a day, but the packaging was excellent.', date: 'April 22, 2026' }
    ];

    function getStars(count) {
        let stars = '';
        for(let i=0; i<5; i++) {
            if(i < count) {
                stars += '<svg class="w-4 h-4 fill-current text-brand-gold" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"></path></svg>';
            } else {
                stars += '<svg class="w-4 h-4 text-gray-600 fill-current" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"></path></svg>';
            }
        }
        return stars;
    }

    function renderReviews() {
        let reviews = JSON.parse(localStorage.getItem('userReviews'));
        if (!reviews || reviews.length === 0) {
            reviews = defaultReviews;
            localStorage.setItem('userReviews', JSON.stringify(reviews));
        }

        const container = document.getElementById('reviews-container');
        container.innerHTML = '';

        reviews.forEach(review => {
            const div = document.createElement('div');
            div.className = 'border-b border-gray-800 pb-6 last:border-0 last:pb-0';
            div.innerHTML = `
                <div class="flex justify-between items-start mb-3">
                    <div>
                        <h4 class="text-white font-bold mb-1">${review.title}</h4>
                        <div class="flex space-x-1 text-sm">${getStars(5)}</div>
                    </div>
                    <span class="text-xs text-gray-500">${review.date}</span>
                </div>
                <p class="text-sm text-gray-300 leading-relaxed mb-3">${review.text}</p>
                <div class="flex items-center space-x-4 text-xs">
                    <button onclick="editReview(${review.id})" class="text-gray-500 hover:text-white transition-colors flex items-center cursor-pointer">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                        Edit
                    </button>
                    <button onclick="deleteReview(${review.id})" class="text-gray-500 hover:text-red-500 transition-colors flex items-center cursor-pointer">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        Delete
                    </button>
                </div>`;
            container.appendChild(div);
        });
    }

    
    const defaultPending = [
        { id: 101, title: 'Banarasi Silk Saree', date: 'May 25, 2026' }
    ];

    function renderPending() {
        let pending = JSON.parse(localStorage.getItem('userPendingReviews'));
        if (!pending) {
            pending = defaultPending;
            localStorage.setItem('userPendingReviews', JSON.stringify(pending));
        }

        const container = document.getElementById('pending-reviews-container');
        if(!container) return;
        
        container.innerHTML = `
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-serif text-white">Pending Reviews</h3>
                <span class="px-3 py-1 ${pending.length > 0 ? 'bg-red-500/20 text-red-500 border border-red-500/30' : 'bg-green-500/20 text-green-500 border border-green-500/30'} rounded-full text-xs font-bold">${pending.length} Awaiting</span>
            </div>
        `;

        if (pending.length === 0) {
            container.innerHTML += `<div class="p-4 rounded-xl border border-gray-800 bg-[#111] text-center text-gray-500 text-sm">You have no pending reviews. Great job!</div>`;
            return;
        }

        pending.forEach(p => {
            container.innerHTML += `
                <div class="p-4 rounded-xl border border-gray-700 bg-[#111] flex items-center justify-between group mb-2">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 bg-gray-800 rounded-lg overflow-hidden border border-gray-700">
                            <div class="w-full h-full bg-brand-gold/10 flex items-center justify-center text-brand-gold font-serif text-lg">H</div>
                        </div>
                        <div>
                            <p class="text-sm font-bold text-white">${p.title}</p>
                            <p class="text-xs text-gray-400">Delivered on ${p.date}</p>
                        </div>
                    </div>
                    <button onclick="writePendingReview(${p.id}, '${p.title.replace(/'/g, "\\'")}')" class="px-4 py-2 bg-brand-gold text-black rounded font-bold text-xs hover:bg-yellow-500 transition-colors cursor-pointer shadow-[0_0_10px_rgba(212,175,55,0.2)]">Write Review</button>
                </div>
            `;
        });
    }

    window.writePendingReview = function(pendingId, productTitle) {
        const text = prompt("Write your review for " + productTitle + ":");
        if (text) {
            // Remove from pending
            let pending = JSON.parse(localStorage.getItem('userPendingReviews'));
            pending = pending.filter(p => p.id !== pendingId);
            localStorage.setItem('userPendingReviews', JSON.stringify(pending));

            // Add to completed
            let reviews = JSON.parse(localStorage.getItem('userReviews')) || defaultReviews;
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            reviews.unshift({ id: Date.now(), title: productTitle, text: text, date: dateStr });
            localStorage.setItem('userReviews', JSON.stringify(reviews));
            
            window.showToast("Review submitted successfully");
            renderPending();
            renderReviews();
        }
    };

    window.addReview = function(productTitle) {
        const text = prompt("Write your review for " + productTitle + ":");
        if (text) {
            let reviews = JSON.parse(localStorage.getItem('userReviews')) || defaultReviews;
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            reviews.unshift({ id: Date.now(), title: productTitle, text: text, date: dateStr });
            localStorage.setItem('userReviews', JSON.stringify(reviews));
            window.showToast("Review submitted successfully");
            renderReviews();
        }
    };

    window.editReview = function(id) {
        let reviews = JSON.parse(localStorage.getItem('userReviews'));
        const review = reviews.find(r => r.id === id);
        const newText = prompt("Edit your review:", review.text);
        if (newText && newText !== review.text) {
            review.text = newText;
            localStorage.setItem('userReviews', JSON.stringify(reviews));
            window.showToast("Review updated successfully");
            renderReviews();
        }
    };

    window.deleteReview = function(id) {
        if(confirm("Are you sure you want to delete this review?")) {
            let reviews = JSON.parse(localStorage.getItem('userReviews'));
            reviews = reviews.filter(r => r.id !== id);
            localStorage.setItem('userReviews', JSON.stringify(reviews));
            window.showToast("Review deleted");
            renderReviews();
        }
    };

    document.addEventListener("DOMContentLoaded", () => { renderReviews(); renderPending(); });
</script>

{% endblock %}
