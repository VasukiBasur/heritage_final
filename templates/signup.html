<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Heritage Handloom Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { black: '#121212', dark: '#1a1a1a', brown: '#3e2723', gold: '#d4af37', lightgold: '#f0e6d2' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #121212; color: #e5e5e5; }
        .glass-card { background: rgba(26, 26, 26, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(212, 175, 55, 0.2); }
        input, select { background-color: rgba(0,0,0,0.5); color: #f0e6d2; border: 1px solid rgba(212, 175, 55, 0.3); }
        input:focus, select:focus { border-color: #d4af37; outline: none; box-shadow: 0 0 0 1px #d4af37; }
        .role-fields { display: none; }
        .role-fields.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-cover bg-center w-full py-12" style="background-image: linear-gradient(rgba(18, 18, 18, 0.8), rgba(18, 18, 18, 0.9)), url('{{ url_for('static', filename='images/saree.png') }}');">
    <div class="glass-card p-10 rounded-sm shadow-2xl w-full max-w-2xl border-t-4 border-t-brand-gold mx-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-serif font-bold text-brand-gold mb-2 tracking-wide">Heritage Handloom</h1>
            <p class="text-brand-lightgold/60 uppercase tracking-widest text-sm">Create an Account</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-6 p-4 rounded-sm text-sm border-l-4 {% if category == 'success' %}bg-green-900/40 border-green-500 text-green-300{% elif category == 'error' %}bg-red-900/40 border-red-500 text-red-300{% else %}bg-brand-brown/40 border-brand-gold text-brand-lightgold{% endif %}">
                  {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('signup') }}" class="space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Global Fields -->
                <div>
                    <label for="role" class="block text-xs font-semibold text-brand-lightgold/70 uppercase tracking-widest mb-2">I am signing up as a...</label>
                    <select id="role" name="role" required class="w-full px-4 py-3 rounded-sm transition-all text-brand-gold appearance-none cursor-pointer">
                        <option value="Admin">Admin / Staff</option>
                        <option value="Weaver">Weaver / Artisan</option>
                        <option value="Supplier">Material Supplier</option>
                        <option value="Customer">Customer / Retailer</option>
                        <option value="Delivery Partner">Delivery Partner</option>
                    </select>
                </div>
                
                <div>
                    <label for="name" class="block text-xs font-semibold text-brand-lightgold/70 uppercase tracking-widest mb-2">Full Name</label>
                    <input type="text" id="name" name="name" required class="w-full px-4 py-3 rounded-sm transition-all text-brand-lightgold">
                </div>

                <div>
                    <label for="email" class="block text-xs font-semibold text-brand-lightgold/70 uppercase tracking-widest mb-2">Email Address</label>
                    <input type="email" id="email" name="email" required class="w-full px-4 py-3 rounded-sm transition-all text-brand-lightgold">
                </div>
                
                <div>
                    <label for="password" class="block text-xs font-semibold text-brand-lightgold/70 uppercase tracking-widest mb-2">Password</label>
                    <input type="password" id="password" name="password" required class="w-full px-4 py-3 rounded-sm transition-all text-brand-lightgold">
                </div>
            </div>

            <div class="border-t border-brand-gold/20 my-6"></div>
            
            <h3 class="text-sm font-serif text-brand-gold mb-4">Role Specific Information</h3>

            <!-- Dynamic Fields -->
            <div id="fields-Weaver" class="role-fields grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-semibold text-brand-lightgold/70 uppercase tracking-widest mb-2">Village / Location</label>
                    <input type="text" name="village" class="w-full px-4 py-3 rounded-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-brand-lightgold/70 uppercase tracking-widest mb-2">Skill Type</label>
                    <select name="skill_type" class="w-full px-4 py-3 rounded-sm text-brand-lightgold">
                        <option value="Master Weaver">Master Weaver</option>
                        <option value="Apprentice">Apprentice</option>
                        <option value="Dyer">Dyer</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-brand-lightgold/70 uppercase tracking-widest mb-2">Aadhaar / ID Number</label>
                    <input type="text" name="aadhaar" class="w-full px-4 py-3 rounded-sm tracking-widest">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-brand-lightgold/70 uppercase tracking-widest mb-2">Contact Number</label>
                    <input type="tel" name="contact" class="w-full px-4 py-3 rounded-sm">
                </div>
            </div>

            <div id="fields-Supplier" class="role-fields grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-semibold text-brand-lightgold/70 uppercase tracking-widest mb-2">Company Name</label>
                    <input type="text" name="company_name" class="w-full px-4 py-3 rounded-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-brand-lightgold/70 uppercase tracking-widest mb-2">Supplier Type</label>
                    <select name="supplier_type" class="w-full px-4 py-3 rounded-sm text-brand-lightgold">
                        <option value="Yarn">Yarn Supplier</option>
                        <option value="Dyes">Natural Dyes</option>
                        <option value="Equipment">Loom Equipment</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-brand-lightgold/70 uppercase tracking-widest mb-2">GST Number</label>
                    <input type="text" name="gst" class="w-full px-4 py-3 rounded-sm font-mono tracking-widest">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-brand-lightgold/70 uppercase tracking-widest mb-2">Contact Number</label>
                    <input type="tel" name="supplier_contact" class="w-full px-4 py-3 rounded-sm">
                </div>
            </div>

            <div id="fields-Customer" class="role-fields grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="col-span-2">
                    <label class="block text-xs font-semibold text-brand-lightgold/70 uppercase tracking-widest mb-2">Delivery Address</label>
                    <input type="text" name="address" class="w-full px-4 py-3 rounded-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-brand-lightgold/70 uppercase tracking-widest mb-2">Phone Number</label>
                    <input type="tel" name="phone" class="w-full px-4 py-3 rounded-sm">
                </div>
            </div>

            <div id="fields-Delivery Partner" class="role-fields grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-semibold text-brand-lightgold/70 uppercase tracking-widest mb-2">Vehicle Type</label>
                    <select name="vehicle_type" class="w-full px-4 py-3 rounded-sm text-brand-lightgold">
                        <option value="Two Wheeler">Two Wheeler</option>
                        <option value="Light Truck">Light Commercial Truck</option>
                        <option value="Heavy Truck">Heavy Truck</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-brand-lightgold/70 uppercase tracking-widest mb-2">Vehicle Registration</label>
                    <input type="text" name="vehicle_reg" class="w-full px-4 py-3 rounded-sm font-mono tracking-widest">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-brand-lightgold/70 uppercase tracking-widest mb-2">Driving License No.</label>
                    <input type="text" name="license" class="w-full px-4 py-3 rounded-sm font-mono tracking-widest">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-brand-lightgold/70 uppercase tracking-widest mb-2">Phone Number</label>
                    <input type="tel" name="delivery_phone" class="w-full px-4 py-3 rounded-sm">
                </div>
            </div>
            
            <div id="fields-Admin" class="role-fields active grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="col-span-2">
                    <label class="block text-xs font-semibold text-brand-lightgold/70 uppercase tracking-widest mb-2">Admin Security Pin</label>
                    <input type="password" name="admin_pin" class="w-full px-4 py-3 rounded-sm tracking-widest" placeholder="Enter Staff PIN">
                </div>
            </div>

            <button type="submit" class="w-full mt-8 bg-brand-gold hover:bg-yellow-500 text-brand-black font-bold uppercase tracking-widest py-4 px-4 rounded-sm transition-colors shadow-lg transform hover:scale-[1.01]">
                Register Account
            </button>
            
            <p class="text-center text-sm text-brand-lightgold/50 mt-4">
                Already have an account? <a href="{{ url_for('login') }}" class="text-brand-gold font-bold hover:text-yellow-400 transition-colors">Login Here</a>
            </p>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const roleSelect = document.getElementById('role');
            const allFieldGroups = document.querySelectorAll('.role-fields');

            function updateFields() {
                const selectedRole = roleSelect.value;
                allFieldGroups.forEach(group => {
                    group.classList.remove('active');
                    // Disable inputs in hidden groups so they aren't submitted or validated
                    group.querySelectorAll('input, select').forEach(el => el.disabled = true);
                });
                
                const activeGroup = document.getElementById('fields-' + selectedRole);
                if (activeGroup) {
                    activeGroup.classList.add('active');
                    activeGroup.querySelectorAll('input, select').forEach(el => el.disabled = false);
                }
            }

            roleSelect.addEventListener('change', updateFields);
            updateFields(); // Run on initial load
        });
    </script>
</body>
</html>
